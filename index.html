<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FE 500問道場 | シラバス Ver.9.2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><h1>FE 500問道場</h1><p>基本情報技術者試験 シラバス Ver.9.2 用語チェック</p></div></header>
<main class="wrap">
<section class="panel controls">
  <label>分野<select id="field"><option value="all">全分野</option><option>テクノロジ系</option><option>マネジメント系</option><option>ストラテジ系</option></select></label>
  <label>出題順<select id="order"><option value="sequential">順番</option><option value="random">ランダム</option><option value="wrong">間違えた問題</option></select></label>
  <button id="start">この条件で開始</button><button id="reset" class="ghost">学習履歴をリセット</button>
</section>
<section class="stats"><div><b id="progress">0 / 500</b><span>現在位置</span></div><div><b id="correctRate">-</b><span>正答率</span></div><div><b id="wrongCount">0</b><span>復習候補</span></div></section>
<section class="panel quiz" id="quiz">
  <div class="meta"><span id="qid">Q1</span><span id="category"></span></div>
  <h2 id="question"></h2><div id="options"></div>
  <div id="result" class="result hidden"><h3 id="resultTitle"></h3><p id="explanation"></p><details><summary>関連用語を見る</summary><p id="related"></p></details></div>
  <div class="nav"><button id="prev" class="ghost">← 前へ</button><button id="next">次へ →</button></div>
</section>
<section class="panel about"><h2>この問題集について</h2><p>IPA「基本情報技術者試験 シラバス Ver.9.2」の用語例ブロックを500問に再構成しています。正解後に関連用語も表示するので、問題だけでなく周辺語もまとめて確認できます。ブラウザのlocalStorageに正誤履歴を保存します。</p></section>
</main>
<script src="questions.js"></script><script src="app.js"></script>
</body></html>
